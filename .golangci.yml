version: "2"

linters:
  default: none

  enable:
    - asciicheck
    - bodyclose
    - cyclop
    # - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    # - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - err113
    - gosec
    - ineffassign
    - makezero
    - mnd
    - gomodguard_v2
    - goprintffuncname
    - govet
    - misspell
    - nakedret
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - predeclared
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - thelper
    - unconvert
    - unparam
    - unused
    - wsl_v5
    - whitespace

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - unnecessaryBlock

    govet:
      enable:
        - shadow

    dupl:
      threshold: 100

    errorlint:
      errorf: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: false

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 40

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 2
      min-occurrences: 2

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    paths:
      - docs

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/qwenhn/go-coffee-shop)

    gofumpt:
      extra:
        group-params: true

  exclusions:
    paths:
      - docs
